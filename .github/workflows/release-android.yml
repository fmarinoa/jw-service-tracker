name: Build & Release Android APK

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.head_ref, 'v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app version
        id: version
        run: |
          VERSION=$(jq -r .version apps/client/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release APK
        run: pnpm --filter @jw-tracker/client apk

      - name: Rename APK
        run: |
          mkdir -p build-artifacts
          cp apps/client/android/app/build/outputs/apk/release/app-release.apk build-artifacts/jw-service-tracker-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Si fue por PR fusionado, github.head_ref contiene el nombre de la rama origen (ej: v0.0.1)
          TAG_NAME="${{ github.head_ref }}"

          # Si no hay head_ref (ej: ejecucion manual), usa la version de package.json
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "null" ]; then
            TAG_NAME="v${{ env.VERSION }}"
          fi

          RELEASE_TITLE="Release $TAG_NAME"

          gh release create "$TAG_NAME" build-artifacts/jw-service-tracker-v${{ env.VERSION }}.apk \
            --title "$RELEASE_TITLE" \
            --notes "APK generado automáticamente para $TAG_NAME de @jw-tracker/client." \
            --generate-notes || \
          gh release upload "$TAG_NAME" build-artifacts/jw-service-tracker-v${{ env.VERSION }}.apk --clobber
