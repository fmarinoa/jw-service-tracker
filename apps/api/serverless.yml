service: jw-service-tracker-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-2'}
  environment:
    ENTRIES_TABLE: ${self:custom.entriesTableName}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt EntriesTable.Arn
            - !Join ['', [!GetAtt EntriesTable.Arn, '/index/userIdIndex']]

custom:
  stage: ${opt:stage, 'dev'}
  stagePascal:
    dev: Dev
    prod: Prod
  entriesTableName: EntriesTable${self:custom.stagePascal.${self:custom.stage}}

functions:
  entries:
    name: EntriesLambda${self:custom.stagePascal.${self:custom.stage}}
    handler: src/handler/index.handler
    events:
      - http:
          path: entries
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            name: CognitoAuthorizer
            arn: !GetAtt CognitoUserPool.Arn
      - http:
          path: entries
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            name: CognitoAuthorizer
            arn: !GetAtt CognitoUserPool.Arn
      - http:
          path: entries/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            name: CognitoAuthorizer
            arn: !GetAtt CognitoUserPool.Arn
      - http:
          path: entries/{id}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            name: CognitoAuthorizer
            arn: !GetAtt CognitoUserPool.Arn

resources:
  Resources:
    # 1. Cognito User Pool (kebab-case + ambiente)
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: jw-service-tracker-user-pool-${self:custom.stage}
        UsernameAttributes:
          - email
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate:
            - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireUppercase: true
            RequireSymbols: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        AutoVerifiedAttributes:
          - email
        MfaConfiguration: OPTIONAL
        EnabledMfas:
          - SOFTWARE_TOKEN_MFA

    # 2. Cognito User Pool Client (kebab-case + ambiente)
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: jw-service-tracker-web-client-${self:custom.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

    # 3. DynamoDB Table (PascalCase + ambiente) con GSI para ordenación por fecha
    EntriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.entriesTableName}
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
          - AttributeName: preachingDate
            AttributeType: N
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: preachingDate
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
  Outputs:
    EntriesTableName:
      Description: "DynamoDB Entries Table Name"
      Value: !Ref EntriesTable
    CognitoUserPoolId:
      Description: "Cognito User Pool ID"
      Value: !Ref CognitoUserPool
    CognitoClientId:
      Description: "Cognito User Pool Client ID"
      Value: !Ref CognitoUserPoolClient
